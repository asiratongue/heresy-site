<script>
    // Target date: Jan 29, 2103
    const targetDate = new Date("Jan 29, 2103 00:00:00").getTime();

    const timer = setInterval(function() {
        const now = new Date().getTime();
        const distance = targetDate - now;

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        
        document.getElementById("countdown").innerHTML = days;

        if (distance < 0) {
            clearInterval(timer);
            document.getElementById("countdown").innerHTML = "EXPIRED";
        }
    }, 1000);

    Loading...
</div>

<script>
    function updateUKCountdown() {
        const now = new Date();
        
        // Calculate milliseconds passed since local midnight
        const midnight = new Date();
        midnight.setHours(24, 0, 0, 0); // Sets time to 00:00:00 of the NEXT day
        
        const diff = midnight - now; // Difference in milliseconds
        
        // Convert to HH:MM:SS
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / (1000 * 60)) % 60);
        const seconds = Math.floor((diff / 1000) % 60);
        
        const display = [hours, minutes, seconds]
            .map(val => String(val).padStart(2, '0'))
            .join(':');
            
        document.getElementById("uk-countdown").innerHTML = display;
    }

    updateUKCountdown();
    setInterval(updateUKCountdown, 1000);
</script></div>
